
spring.application.name=skilllink-backend

# ===============================
# DATABASE CONFIGURATION
# ===============================
## For local
#DB_URL=jdbc:mysql://localhost:3307/skilllink_db
#DB_USERNAME=root
#DB_PASSWORD=

# For cloud
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# SECURITY LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# BREVO SMTP CONFIGURATION
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=c10438001@smtp-brevo.com
spring.mail.password=${SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# SKILLLINK EMAIL DETAILS
# ===============================
app.mail.from=skilllink.supportteam@gmail.com
app.mail.sender-name=SkillLink Team

# ===============================
# EMAIL VERIFICATION URL
# ===============================
app.verification.base-url=http://localhost:8080
