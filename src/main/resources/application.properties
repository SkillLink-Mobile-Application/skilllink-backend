
spring.application.name=skilllink-backend

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/skilllink_db
spring.datasource.username=root
spring.datasource.password=

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# SECURITY LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# GMAIL SMTP CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=skilllink.supportteam@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# SKILLLINK EMAIL DETAILS
# ===============================
app.mail.from=skilllink.supportteam@gmail.com
app.mail.sender-name=SkillLink Team

# ===============================
# EMAIL VERIFICATION URL
# ===============================
app.verification.base-url=http://localhost:8080
